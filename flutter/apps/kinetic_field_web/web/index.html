<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shape a living particle field with your movement. MoveNet runs privately in your browser.">
  <meta name="theme-color" content="#050810">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kinetic Field">
  <meta property="og:description" content="Shape a living particle field with your movement. Camera processing stays on your device.">
  <meta property="og:url" content="https://kinetic-field-play.web.app/">
  <meta property="og:image" content="https://kinetic-field-play.web.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kinetic Field, a luminous movement-responsive particle world.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kinetic Field">
  <meta name="twitter:description" content="Move your hands to shape flowers, fireflies, honeybees and a moonlit pond.">
  <meta name="twitter:image" content="https://kinetic-field-play.web.app/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kinetic Field">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kinetic Field</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    TensorFlow.js, MoveNet and the model weights are bundled below this web
    directory. The bridge never loads code or model data from a CDN.
  -->
  <script src="movenet/kinetic_field_movenet.js"></script>
  <!-- Procedural Web Audio only. Sound remains off until explicitly enabled. -->
  <script src="soundscape/kinetic_field_soundscape.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
